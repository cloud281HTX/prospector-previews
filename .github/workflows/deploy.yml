# ---------------------------------------------------------------------------
# Deploy static previews to GitHub Pages using OIDC (no long-lived Pages token).
#
# SECURITY NOTE: This workflow contains NO `run:` steps that interpolate
# untrusted event payloads (no ${{ github.event.* }} in shell commands), so the
# standard Actions injection surface does not apply. Pages deploy is handled by
# the pinned official actions only, driven by the ephemeral OIDC identity.
#
# SECURITY MODEL:
#  - The Pages deployment runs on an EPHEMERAL OIDC token minted by GitHub
#    Actions for this run (`id-token: write`). No Pages credential is stored.
#  - The workflow triggers on push to `main` and on manual dispatch.
#  - `permissions: contents: read` + `pages: write` + `id-token: write` is the
#    minimal privilege set Pages deployment requires.
#  - triggers:
#      * global: holds a fine-grained PAT scoped to THIS repo with ONLY
#        Contents:write + Metadata:read. It never touches other repos or orgs.
# ---------------------------------------------------------------------------
name: Deploy previews to GitHub Pages

# Trigger on push to the default branch and on manual dispatch
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN for this job (least privilege).
# Pages deploy needs only these three; `contents` read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-progress runs started fresh.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Static previews live in /public (no framework, no build step).
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
